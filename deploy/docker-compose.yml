name: streamfilm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamfilm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: streamfilm
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamfilm"]
      interval: 5s
      retries: 20

  # minio/minio trên Docker Hub không còn tải được; dùng Chainguard, ghim digest.
  minio:
    image: cgr.dev/chainguard/minio:latest-dev@sha256:5735e8125c4af7dd310dc5780508bfb850f0b68783a1a56089b5c64316a8f603
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      # M7: trang admin PUT part thẳng từ trình duyệt (origin của SPA) lên presigned URL :9000 — cross-origin.
      # Mặc định MinIO cho mọi origin ("*"); giới hạn lại về SPA (nginx) và Vite dev server (ADR 0019).
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:8088,http://localhost:5173}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/ready"]
      interval: 5s
      retries: 20

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:e1f3f37e8b13f34be49494f441ca01ff7be4e05d7cf04bf26681b0fe380852e1
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/${S3_BUCKET_RAW} &&
      mc mb --ignore-existing local/${S3_BUCKET_HLS} &&
      mc anonymous set download local/${S3_BUCKET_HLS}
      "
    restart: "no"

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["127.0.0.1:29092:29092"]
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      for t in video.uploaded video.uploaded.dlq video.processing video.transcoded video.failed playback.events app.logs; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1 || exit 1;
      done
      "
    restart: "no"

  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: kafka:9092
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      kafka: { condition: service_healthy }

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: streamfilm
      CLICKHOUSE_USER: streamfilm
      CLICKHOUSE_PASSWORD: ${POSTGRES_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["127.0.0.1:8123:8123"]
    volumes: [chdata:/var/lib/clickhouse]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      retries: 20

  # Cổng vào duy nhất cho trình duyệt (ADR 0011): SPA ở /, proxy /api/ → api, HLS ký ở /cdn/.
  nginx:
    build:
      context: ..
      dockerfile: deploy/docker/nginx.Dockerfile
    image: streamfilm-nginx:dev
    ports: ["127.0.0.1:8088:80"]
    environment:
      # Entrypoint của image chạy envsubst trên /etc/nginx/templates/*.template → /etc/nginx/conf.d/.
      CDN_SIGNING_SECRET: ${CDN_SIGNING_SECRET:?CDN_SIGNING_SECRET chưa đặt trong .env (chạy make env)}
      NGINX_ENVSUBST_FILTER: "^CDN_"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ../web/dev:/usr/share/nginx/html/dev:ro
    depends_on:
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    image: streamfilm-api:dev
    environment:
      HTTP_ADDR: ":8000"
      DATABASE_URL: postgres://streamfilm:${POSTGRES_PASSWORD}@postgres:5432/streamfilm?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      # Presigned URL được ký cho địa chỉ mà máy host nhìn thấy (chữ ký gắn với Host).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW}
      S3_BUCKET_HLS: ${S3_BUCKET_HLS}
      STALE_UPLOAD_AFTER: 24h
      CLEANUP_INTERVAL: 1h
      # Origin mà trình duyệt mở (nginx); /play trả URL tuyệt đối CDN_BASE_URL + /cdn/s/...
      CDN_BASE_URL: ${CDN_BASE_URL:-http://localhost:8088}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET chưa đặt trong .env (chạy make env)}
      CDN_SIGNING_SECRET: ${CDN_SIGNING_SECRET:?CDN_SIGNING_SECRET chưa đặt trong .env (chạy make env)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz | grep -q ok"]
      interval: 5s
      retries: 20

  transcoder:
    build:
      context: ..
      dockerfile: deploy/docker/transcoder.Dockerfile
    image: streamfilm-transcoder:dev
    command: ["worker"]
    environment:
      KAFKA_BROKERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW}
      S3_BUCKET_HLS: ${S3_BUCKET_HLS}
      WORK_DIR: /tmp
    depends_on:
      minio-init: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 30s

  # M6: playback.events + app.logs → ClickHouse theo lô (1000 record hoặc 1 giây). Tự tạo bảng khi khởi động.
  analytics:
    build:
      context: ..
      dockerfile: deploy/docker/analytics.Dockerfile
    image: streamfilm-analytics:dev
    environment:
      KAFKA_BROKERS: kafka:9092
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: streamfilm
      CLICKHOUSE_USER: streamfilm
      CLICKHOUSE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      clickhouse: { condition: service_healthy }
    restart: unless-stopped
    # Khi tắt: chờ INSERT đang chạy (InsertTimeout 10 giây) rồi ghi nốt lô (ShutdownTimeout 10 giây) = tối đa 20 giây.
    stop_grace_period: 25s

volumes:
  pgdata:
  miniodata:
  kafkadata:
  chdata:
